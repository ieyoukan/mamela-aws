name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mamela-aws
      - uses: actions/checkout@v4
        with:
          repository: ieyoukan/mamela
          ref: main
          path: mamela
      # The Go that builds pome/provider.wasm (build.sh): another release gives another program.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Mamela's pinned toolchain (emela, wasmtime) and the Pomes' dependencies
        working-directory: mamela
        run: scripts/install-toolchain.sh
      # AWS's models the catalogs come from (catalogs/models.lock.json: commit and sha256 pinned):
      # with them, the tests check that pome/catalogs is what they and the overlay give.
      - uses: actions/cache@v4
        with:
          path: mamela-aws/.cache/aws-models
          key: aws-models-${{ hashFiles('mamela-aws/catalogs/models.lock.json') }}
      - name: AWS's models
        working-directory: mamela-aws
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: go run ./cmd/aws-catalogs fetch
      - name: Test
        working-directory: mamela-aws
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
          MAMELA_TOOLCHAIN_DIR: ${{ github.workspace }}/mamela/.tools/bin
          EMELA_POME_CACHE: ${{ github.workspace }}/mamela/.tools/pomes
        run: go vet ./... && go test ./...
